<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="0.55" stop-color="#0f9488"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#042f2e" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- full-bleed background; the artwork stays inside the central 78% (maskable safe zone) -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <g transform="translate(256 256) scale(0.78) translate(-256 -256) translate(-15 -19)" filter="url(#shadow)">
    <circle cx="256" cy="196" r="84" fill="url(#coin)"/>
    <circle cx="256" cy="196" r="58" fill="none" stroke="#b45309" stroke-opacity="0.45" stroke-width="10"/>
    <rect x="84" y="206" width="344" height="232" rx="52" fill="#ffffff"/>
    <rect x="312" y="288" width="146" height="82" rx="41" fill="#0f766e"/>
    <circle cx="354" cy="329" r="17" fill="#ffffff"/>
  </g>
</svg>
